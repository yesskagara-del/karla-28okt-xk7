<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>A Birthday Magazine for Karla Cacicu</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Inter:wght@400;500&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--wine:#5e1424;--wine2:#7a1d31;--cream:#f6eee0;--ivory:#fbf7ef;--ink:#2b1d17;--pink:#d9a5ad;--serif:'Playfair Display',Georgia,'Times New Roman',serif;--sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--script:'Caveat','Segoe Script','Brush Script MT',cursive;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--sans);overflow-x:hidden;
background-image:radial-gradient(rgba(94,20,36,.05) 1px,transparent 1px);background-size:5px 5px}
img{max-width:100%;display:block}
.page{min-height:100svh;padding:56px 22px;display:flex;flex-direction:column;justify-content:center;align-items:center;position:relative}
.wrap{width:100%;max-width:440px}
.folio{position:absolute;top:18px;left:22px;right:22px;display:flex;justify-content:space-between;font-size:11px;letter-spacing:.12em;opacity:.6}
.rule{height:0;border-top:1px solid currentColor;border-bottom:1px solid currentColor;padding-top:2px;opacity:.7;margin:14px 0}
h1,h2{font-family:var(--serif);font-weight:700;margin:0;line-height:1.05}
.script{font-family:var(--script);font-size:26px;color:var(--wine2)}
.star{color:var(--pink);font-size:18px}
/* cover */
.cover{background:var(--wine);color:var(--ivory)}
.cover .mast{font-family:var(--serif);font-size:13px;letter-spacing:.2em;line-height:1.6;text-align:center}
.cover h1{font-size:clamp(46px,15vw,70px);text-align:center;font-style:italic;font-weight:500;margin:6px 0}
.cover h1 b{display:block;font-style:normal;font-weight:700;font-size:.62em;letter-spacing:.04em}
.cover .frame{margin:18px auto;width:78%}
.cover .lines{display:flex;justify-content:space-between;gap:12px;font-size:13px;line-height:1.5}
.cover .lines div:last-child{text-align:right}
.cover .script{color:var(--pink)}
.hint{margin-top:22px;font-size:12px;letter-spacing:.2em;opacity:.7;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(6px)}}
/* photo */
.ph{position:relative;display:block;background:#e9dcc8;aspect-ratio:3/4;overflow:hidden;cursor:pointer}
.ph img{width:100%;height:100%;object-fit:cover}
.ph .empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--wine2);font-size:12px;text-align:center;padding:10px;background:repeating-linear-gradient(45deg,#eadfcc,#eadfcc 8px,#e4d6c0 8px,#e4d6c0 16px)}
.ph .empty span{font-size:26px}
.ph input{display:none}
.frame{background:var(--ivory);padding:10px 10px 34px;box-shadow:0 10px 24px rgba(40,10,15,.3);position:relative}
.frame.thin{padding:8px}
.cap{position:absolute;bottom:6px;left:0;right:0;text-align:center;font-family:var(--script);font-size:20px;color:var(--ink)}
.tape{position:absolute;top:-10px;left:50%;width:70px;height:20px;margin-left:-35px;background:rgba(217,165,173,.7);transform:rotate(-3deg)}
/* editorial */
.edit .frame{transform:rotate(-1.5deg);margin-bottom:26px}
.edit h2{font-size:34px;margin-bottom:10px;font-style:italic;font-weight:500}
.edit p{font-family:var(--serif);font-size:17px;line-height:1.7;margin:0}
.edit p::first-letter{font-size:3.2em;float:left;line-height:.85;padding:4px 8px 0 0;color:var(--wine);font-weight:700}
/* collage */
.collage{display:grid;grid-template-columns:1fr 1fr;gap:18px 14px;margin-top:20px}
.collage .frame:nth-child(1){transform:rotate(-3deg)}
.collage .frame:nth-child(2){transform:rotate(2.5deg);margin-top:26px}
.collage .frame:nth-child(3){transform:rotate(2deg)}
.collage .frame:nth-child(4){transform:rotate(-2.5deg);margin-top:26px}
.collage .ph{aspect-ratio:1/1.2}
.center{text-align:center}
.center h2{font-size:34px;font-style:italic;font-weight:500}
/* greeting */
.greet{background:var(--ivory)}
.greet h1{font-size:clamp(40px,13vw,60px);text-align:center;color:var(--wine);font-weight:500;font-style:italic}
.greet h1 b{display:block;font-style:normal;font-weight:700;letter-spacing:.02em}
.greet p{text-align:left;font-family:var(--serif);font-size:16px;line-height:1.7;margin:16px 0 0;white-space:pre-line}
.sticker{display:inline-grid;place-items:center;width:56px;height:56px;border-radius:50%;background:var(--wine);color:var(--ivory);font-size:22px;transform:rotate(-8deg);margin-top:18px}
/* reasons */
.reasons{background:var(--wine);color:var(--ivory)}
.reasons h2{font-size:32px;font-style:italic;font-weight:500;text-align:center}
.reasons ol{list-style:none;padding:0;margin:8px 0 0;counter-reset:r}
.reasons li{counter-increment:r;display:grid;grid-template-columns:44px 1fr;gap:10px;padding:14px 0;border-bottom:1px solid rgba(251,247,239,.25);font-family:var(--serif);font-size:17px;line-height:1.55;opacity:0;transform:translateY(14px);transition:.7s}
.reasons li.in{opacity:1;transform:none}
.reasons li::before{content:counter(r,decimal-leading-zero);font-size:26px;color:var(--pink);font-style:italic}
/* letter */
.paper{background:var(--ivory);padding:28px 24px;box-shadow:0 12px 28px rgba(40,10,15,.22);position:relative;background-image:repeating-linear-gradient(transparent,transparent 31px,rgba(94,20,36,.12) 32px)}
.paper p{font-family:var(--script);font-size:24px;line-height:32px;margin:0 0 32px;white-space:pre-line}
.paper .sign{text-align:right;color:var(--wine2);font-size:30px;margin:0}
.env{width:100%;border:0;background:var(--wine2);color:var(--ivory);padding:34px 20px;font-family:var(--serif);font-size:20px;font-style:italic;box-shadow:0 12px 28px rgba(40,10,15,.25);cursor:pointer;min-height:56px}
.env small{display:block;font-family:var(--sans);font-style:normal;font-size:12px;letter-spacing:.15em;margin-top:8px;opacity:.75}
.hide{display:none}
.show{animation:unfold .9s ease both}
@keyframes unfold{from{opacity:0;transform:translateY(24px) scale(.97)}}
/* closing */
.end{background:var(--wine);color:var(--ivory);text-align:center}
.end h2{font-size:38px;font-style:italic;font-weight:500;margin-bottom:6px}
.cake{position:relative;width:140px;height:110px;margin:30px auto 10px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.cake .tier{position:absolute;left:0;right:0;bottom:0;height:62px;background:var(--pink);border-radius:8px 8px 4px 4px}
.cake .tier::before{content:"";position:absolute;top:0;left:0;right:0;height:16px;background:var(--ivory);border-radius:8px 8px 14px 14px}
.cake .stick{position:absolute;left:50%;bottom:62px;width:6px;height:26px;margin-left:-3px;background:var(--ivory)}
.flame{position:absolute;left:50%;bottom:86px;width:14px;height:24px;margin-left:-7px;background:radial-gradient(#fff3b0,#ffb03a);border-radius:50% 50% 50% 50%/65% 65% 35% 35%;transform-origin:bottom;animation:fl 1s ease-in-out infinite;transition:.5s}
.out .flame{opacity:0;transform:scale(0)}
@keyframes fl{50%{transform:scale(1.08,.92) rotate(3deg)}}
.wish{min-height:40px;font-family:var(--script);font-size:26px;color:var(--pink)}
.small{font-size:12px;letter-spacing:.2em;opacity:.65;margin-top:26px}
.float{position:fixed;bottom:-30px;color:var(--pink);pointer-events:none;animation:up 4s linear forwards;z-index:5}
@keyframes up{to{transform:translateY(-110vh) rotate(25deg);opacity:0}}
.rv{opacity:0;transform:translateY(18px);transition:opacity .9s,transform .9s}
.rv.in{opacity:1;transform:none}
button:focus-visible,.ph:focus-within{outline:2px solid var(--pink);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv,.reasons li{opacity:1;transform:none}}
</style>
</head>

var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}})},{threshold:.15});
document.querySelectorAll('.rv').forEach(function(n){io.observe(n)});
var lis=document.querySelectorAll('.reasons li');
var io2=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){
  var i=[].indexOf.call(lis,e.target);setTimeout(function(){e.target.classList.add('in')},i*120);io2.unobserve(e.target)}})},{threshold:.3});
lis.forEach(function(n){io2.observe(n)});
